<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="task1.css">
</head>
<body>

<div class="container my-5">
    <div class="card booking-card mx-auto p-4 p-md-5 shadow-lg">
        <h2 class="card-title text-white mb-4 p-3 rounded">Book a train ticket</h2>
        
        <form>
            <!-- Trip Type Radio Pills -->
            <div class="mb-4">
                <div class="btn-group" role="group" aria-label="Trip type">
                    <input type="radio" class="btn-check" name="tripType" id="oneWay" autocomplete="off" checked>
                    <label class="btn btn-outline-success" for="oneWay">One way</label>

                    <input type="radio" class="btn-check" name="tripType" id="roundTrip" autocomplete="off">
                    <label class="btn btn-outline-success" for="roundTrip">Round trip</label>
                </div>
            </div>

            <!-- From / To -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="fromCity" class="form-label">From</label>
                    <input type="text" class="form-control" id="fromCity" value="Astana" required>
                </div>
                <div class="col-md-6">
                    <label for="toCity" class="form-label">To</label>
                    <input type="text" class="form-control" id="toCity" value="Almaty" required>
                </div>
            </div>

            <!-- Departure, Return, Passengers -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="departureDate" class="form-label">Departure</label>
                    <input type="date" class="form-control" id="departureDate" required>
                </div>
                <div class="col-md-4">
                    <label for="returnDate" class="form-label">Return</label>
                    <input type="date" class="form-control" id="returnDate">
                </div>
                <div class="col-md-4">
                    <label for="passengers" class="form-label">Passengers</label>
                    <select class="form-select" id="passengers" required>
                        <option value="1" selected>1 adult</option>
                        <option value="2">2 adults</option>
                        <option value="3">3 adults</option>
                        <option value="4">4 adults</option>
                        <option value="5">5 adults</option>
                        <option value="6">6 adults</option>
                    </select>
                </div>
            </div>

            <!-- Carriage Class -->
            <div class="mb-3">
                <label class="form-label d-block">Carriage class</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriageClass" id="seat" value="Seat" required>
                    <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriageClass" id="coupe" value="Coupé">
                    <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" value="Sleeper">
                    <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
            </div>

            <!-- Phone and Email -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+7 701 234 56 78" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- Checkboxes -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="smsCheck">
                <label class="form-check-label" for="smsCheck">Also send the ticket by SMS</label>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rulesCheck" required>
                <label class="form-check-label" for="rulesCheck">I agree with the carriage rules</label>
            </div>

            <!-- Action Buttons (Flex order used for mobile view) -->
            <div class="d-flex flex-column flex-md-row gap-2 action-buttons">
                <button type="submit" class="btn btn-warning btn-find text-white fw-bold order-1 order-md-2">Find trains</button>
                <button type="reset" class="btn btn-outline-secondary btn-clear order-2 order-md-1">Clear</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
